[project]
name = "splitser-mcp"
version = "0.1.0"
description = "MCP server for Splitser / WieBetaaltWat"
license = "MIT"
authors = [
    { name = "Jeroen Meijer", email = "jeroenfkmeijer@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "splitser-api",
    "mcp[cli]>=2",
]

[build-system]
requires = ["uv_build>=0.10.11,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.15.7",
]

[tool.uv.sources]
splitser-api = { path = "../api", editable = true }

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["**/__pycache__", "**/*.pyc", "**/node_modules", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ARG", "SIM"]
